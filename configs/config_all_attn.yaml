# Tactical Speech Recognition - Ablation Study: All Attention Modules

experiment:
  name: "tactical_whisper_all_attn"
  seed: 42

model:
  model_id: "openai/whisper-small"
  device: "auto"

dataset:
  name: "openslr/librispeech_asr"
  subset: "clean"
  train_split: "validation[:50]"
  eval_split: "validation[:50]"

degradation:
  enabled: true
  min_snr_db: -5.0
  max_snr_db: 0.0
  central_freq: 1400.0
  q: 0.707

lora:
  r: 8
  lora_alpha: 32
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "out_proj"
  lora_dropout: 0.05
  bias: "none"

training:
  output_dir: "checkpoints/tactical_whisper_all_attn"
  num_train_epochs: 2
  per_device_train_batch_size: 4
  learning_rate: 0.001
  logging_steps: 5
  fp16: true
  skip_zero_shot: false

evaluation:
  metric: "wer"

